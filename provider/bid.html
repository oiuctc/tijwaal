<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse Jobs – Tijwaal Provider</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .job-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            background: var(--bg-card);
            transition: all var(--transition);
            margin-bottom: 1rem;
        }

        .job-card:hover {
            border-color: var(--border-gold);
            box-shadow: var(--shadow-gold);
        }

        .job-category-icon {
            width: 44px;
            height: 44px;
            background: var(--gold-dim);
            border: 1px solid var(--border-gold);
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 1.25rem;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .pulse-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--teal);
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>

<body class="bg-gradient">
    <div class="navbar">
        <a href="dashboard.html" style="color:var(--text-muted);font-size:1.2rem;">←</a>
        <div>
            <div style="font-weight:700;">Browse Available Jobs</div>
            <div style="font-size:0.75rem;color:var(--text-muted);"><span class="pulse-dot"></span> Live updates</div>
        </div>
        <div style="margin-left:auto;"><span class="badge badge-gold" id="jobCount">Loading…</span></div>
    </div>

    <!-- Job Cards Container -->
    <div id="jobsList">
        <div class="empty-state" id="emptyState">
            <div style="font-size:3rem;">📋</div>
            <div style="font-weight:700; font-size:1.1rem; margin:0.5rem 0;">No open requests right now</div>
            <div>New jobs will appear here automatically when customers post requests.</div>
        </div>
    </div>

    <!-- Bid Submission Modal -->
    <div class="modal-overlay" id="bidModal">
        <div class="modal">
            <div class="modal-header">
                <h3>💼 Submit Bid</h3><button class="modal-close">✕</button>
            </div>
            <div class="card card--gold mb-3" style="padding:0.75rem;">
                <div style="font-size:0.75rem;color:var(--text-muted);">Job</div>
                <div style="font-weight:700;" id="bidJobName">Loading…</div>
                <div style="font-size:0.75rem;color:var(--text-muted);" id="bidJobId"></div>
            </div>
            <div style="display:flex;flex-direction:column;gap:1rem;">
                <div class="form-group">
                    <label>Your Bid Amount (SAR)</label>
                    <input class="form-control" type="number" id="bidAmount" placeholder="e.g. 180" min="50" />
                    <div style="font-size:0.72rem;color:var(--text-muted);margin-top:0.3rem;">Platform fee of 10% will
                        be deducted. You receive 90%.</div>
                </div>
                <div class="form-group">
                    <label>Estimated Time to Arrive</label>
                    <select class="form-control" id="bidEta">
                        <option>15 min</option>
                        <option>25 min</option>
                        <option>40 min</option>
                        <option>1 hour</option>
                        <option>2 hours</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Note to Customer</label>
                    <textarea class="form-control" id="bidNote"
                        placeholder="Explain why you're the best choice for this job…"></textarea>
                </div>
                <div class="card" style="background:var(--bg-input);">
                    <div style="font-size:0.78rem;font-weight:600;margin-bottom:0.5rem;color:var(--text-secondary);">
                        Earnings Preview</div>
                    <div style="display:flex;justify-content:space-between;font-size:0.82rem;"><span
                            style="color:var(--text-muted);">Your Bid</span><span id="previewBid">SAR —</span></div>
                    <div style="display:flex;justify-content:space-between;font-size:0.82rem;"><span
                            style="color:var(--text-muted);">Platform Fee (10%)</span><span id="previewFee"
                            style="color:var(--danger);">—</span></div>
                    <div
                        style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;margin-top:0.4rem;">
                        <span>You Receive</span><span id="previewNet" style="color:var(--success);">SAR —</span>
                    </div>
                </div>
                <button class="btn btn-primary btn-block btn-lg" id="submitBidBtn" onclick="submitBid()">🚀 Submit
                    Bid</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/firestore-service.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Check session
        const user = getSession();
        if (!user || user.role !== 'provider') {
            window.location.href = 'register.html';
        }

        let currentRequestId = '';
        const categoryIcons = {
            'Electrician': '⚡', 'Plumber': '🔧', 'Carpenter': '🪑',
            'Maintenance': '🏠', 'Transport': '🚗', 'Delivery': '📦',
            'Flatbed': '🚛', 'Painting': '🎨'
        };

        function getCategoryIcon(cat) {
            for (const [key, icon] of Object.entries(categoryIcons)) {
                if (cat && cat.includes(key)) return icon;
            }
            return '🔧';
        }

        // Real-time listener for open requests
        FirestoreService.onOpenRequests((requests) => {
            const container = document.getElementById('jobsList');
            const empty = document.getElementById('emptyState');

            if (requests.length === 0) {
                if (empty) empty.style.display = 'block';
                document.getElementById('jobCount').textContent = '0 open';
                return;
            }

            if (empty) empty.style.display = 'none';
            document.getElementById('jobCount').textContent = requests.length + ' open';

            container.innerHTML = '';
            requests.forEach(req => {
                const icon = getCategoryIcon(req.category);
                const budget = req.budgetMin && req.budgetMax
                    ? `~SAR ${req.budgetMin}–${req.budgetMax}`
                    : (req.budgetMax ? `~SAR ${req.budgetMax}` : 'Open budget');

                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div style="display:flex; gap:1rem; align-items:flex-start;">
                        <div class="job-category-icon">${icon}</div>
                        <div style="flex:1;">
                            <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.5rem;">
                                <div>
                                    <div style="font-weight:700;">${req.category || 'Service Request'}</div>
                                    <div style="font-size:0.75rem;color:var(--text-muted);">${req.location || 'Location not specified'} · by ${req.customerName || 'Customer'}</div>
                                </div>
                                <div style="text-align:right;">
                                    <div style="font-weight:800;color:var(--gold);font-size:1.1rem;">${budget}</div>
                                    <div style="font-size:0.72rem;color:var(--text-muted);">${req.preferredTime || ''}</div>
                                </div>
                            </div>
                            <p style="font-size:0.82rem;color:var(--text-secondary);margin:0.5rem 0;">"${req.description || 'No description provided.'}"</p>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.75rem;">
                                <div style="font-size:0.78rem; color:var(--text-muted);">
                                    📍 ${req.location || '—'}
                                </div>
                                <button class="btn btn-primary btn-sm" onclick="openBidModal('${req.id}', '${(req.category || 'Service').replace(/'/g, "\\'")}')">Place Bid →</button>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        });

        // Open bid modal
        function openBidModal(requestId, jobName) {
            currentRequestId = requestId;
            document.getElementById('bidJobName').textContent = jobName;
            document.getElementById('bidJobId').textContent = '#' + requestId.substring(0, 8);
            document.getElementById('bidAmount').value = '';
            document.getElementById('bidNote').value = '';
            updatePreview();
            openModal('bidModal');
        }

        // Earnings preview
        document.getElementById('bidAmount')?.addEventListener('input', updatePreview);
        function updatePreview() {
            const amt = parseFloat(document.getElementById('bidAmount').value) || 0;
            const fee = amt * 0.1;
            document.getElementById('previewBid').textContent = amt ? `SAR ${amt}` : 'SAR —';
            document.getElementById('previewFee').textContent = amt ? `-SAR ${fee.toFixed(0)}` : '—';
            document.getElementById('previewNet').textContent = amt ? `SAR ${(amt - fee).toFixed(0)}` : 'SAR —';
        }

        // Submit bid to Firestore
        async function submitBid() {
            const amt = parseFloat(document.getElementById('bidAmount').value);
            if (!amt || amt < 50) { showToast('Enter a valid bid amount (min SAR 50)', 'warning'); return; }

            const btn = document.getElementById('submitBidBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Submitting…';

            try {
                await FirestoreService.submitBid(currentRequestId, {
                    providerId: user.uid,
                    providerName: user.name,
                    amount: amt,
                    eta: document.getElementById('bidEta').value,
                    note: document.getElementById('bidNote').value.trim()
                });
                closeModal('bidModal');
                showToast(`✅ Bid of SAR ${amt} submitted!`, 'success');
            } catch (err) {
                console.error(err);
                showToast('Error submitting bid: ' + err.message, 'error');
            }
            btn.disabled = false;
            btn.innerHTML = '🚀 Submit Bid';
        }
    </script>
</body>

</html>
