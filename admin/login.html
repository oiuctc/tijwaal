<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login – Tijwaal</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(212, 168, 67, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .login-box {
            width: min(420px, 90vw);
            background: rgba(13, 21, 37, 0.9);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-card);
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .login-logo .lmark {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 900;
            font-size: 1.3rem;
            color: #07080D;
        }

        .login-logo .ltxt {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .login-logo .lsub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.4rem;
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .forgot {
            text-align: right;
            font-size: 0.8rem;
            color: var(--gold);
            margin-top: -0.5rem;
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }

        .divider-or::before,
        .divider-or::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .back-link {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        .back-link a {
            color: var(--gold);
        }
    </style>
</head>

<body class="bg-gradient">
    <div class="login-box fade-up">
        <div class="login-logo">
            <div class="lmark">T</div>
            <div>
                <div class="ltxt">Tijwaal Admin</div>
                <div class="lsub">Control Panel · لوحة التحكم</div>
            </div>
        </div>
        <h2>Welcome Back</h2>
        <p style="font-size:0.85rem;">Sign in to manage the Tijwaal platform.</p>
        <div class="form-stack">
            <div class="form-group">
                <label>Email Address</label>
                <input class="form-control" type="email" placeholder="admin@tijwaal.sa" id="adminEmail" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input class="form-control" type="password" placeholder="••••••••" id="adminPass" />
            </div>
            <div class="forgot"><a href="#">Forgot password?</a></div>
            <button class="btn btn-primary btn-block btn-lg" id="loginBtn" onclick="doLogin()">Sign In to Admin
                Panel</button>
            <div class="divider-or">or</div>
            <a href="../index.html" class="btn btn-ghost btn-block">← Back to Platform Home</a>
        </div>
        <div class="back-link">
            Need access? <a href="#">Contact super admin</a>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script>
        function doLogin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            if (!email || !pass) { showToast('Please fill in all fields', 'warning'); return; }
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner"></span> Signing in…';
            btn.disabled = true;
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>

</html>
